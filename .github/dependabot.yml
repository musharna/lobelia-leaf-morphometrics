version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

# No pip ecosystem here, deliberately. requirements.txt in this repo is a
# PROVENANCE RECORD, not a dependency specification: its header states the
# versions the published numbers were produced under, and scikit-learn is
# pinned exactly because the LDA accuracies quoted in the README (0.372
# grouped, 0.430 naive) move between scikit-learn versions -- README line 158
# says so at the install command.
#
# Dependabot cannot tell those two kinds of file apart. Enabling pip here
# produced five PRs that each proposed to invalidate the record: one to
# repoint the exact pin from 1.7.* to 1.9.*, and four to raise floors that
# describe the environment the figures came from. With no CI in this repo,
# nothing would have caught any of them.
